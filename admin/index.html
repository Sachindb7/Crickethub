<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricketHub Admin — Article Generator</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
    --bg: #06080f; --bg-s: #0d1117; --bg-c: #111827; --bg-e: #1e293b;
    --gold: #f59e0b; --gold-l: #fbbf24; --gold-d: #d97706;
    --red: #ef4444; --green: #22c55e; --blue: #3b82f6;
    --t1: #f1f5f9; --t2: #94a3b8; --t3: #64748b;
    --border: #1e293b; --border-h: #334155;
    --r: 12px; --ease: cubic-bezier(0.4,0,0.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--t1); line-height: 1.6; min-height: 100vh; }
a { color: var(--gold); text-decoration: none; }

/* Header */
.admin-header {
    background: var(--bg-s); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
}
.admin-header h1 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.admin-header .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--gold), var(--red)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
.admin-header .badge { background: var(--gold); color: #000; padding: 2px 10px; border-radius: 99px; font-size: 0.7rem; font-weight: 700; }

/* Tabs */
.tabs { display: flex; background: var(--bg-s); border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; }
.tab-btn {
    padding: 14px 24px; font-size: 0.85rem; font-weight: 600; color: var(--t3);
    border: none; background: none; cursor: pointer; position: relative;
    font-family: 'Inter', sans-serif; white-space: nowrap; transition: color 0.2s;
}
.tab-btn:hover { color: var(--t2); }
.tab-btn.active { color: var(--gold); }
.tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--gold); }

/* Main layout */
.admin-main { display: grid; grid-template-columns: 1fr 320px; min-height: calc(100vh - 110px); }
.editor-panel { padding: 24px; overflow-y: auto; }
.seo-panel {
    background: var(--bg-s); border-left: 1px solid var(--border);
    padding: 24px; overflow-y: auto; position: sticky; top: 110px;
    max-height: calc(100vh - 110px);
}

/* Tab content */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Form elements */
.form-row { margin-bottom: 20px; }
.form-row label { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--t2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-row label .char-count { font-weight: 400; text-transform: none; letter-spacing: 0; }
.form-row label .char-count.warn { color: var(--gold); }
.form-row label .char-count.bad { color: var(--red); }
.form-row label .char-count.good { color: var(--green); }

input[type="text"], input[type="url"], input[type="email"], input[type="date"],
textarea, select {
    width: 100%; padding: 10px 14px; background: var(--bg-c); border: 1px solid var(--border);
    border-radius: var(--r); color: var(--t1); font-family: 'Inter', sans-serif; font-size: 0.9rem;
    outline: none; transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--gold); }
textarea { resize: vertical; }
select { cursor: pointer; }
select option { background: var(--bg-c); color: var(--t1); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Toolbar */
.toolbar {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; background: var(--bg-e);
    border: 1px solid var(--border); border-bottom: none; border-radius: var(--r) var(--r) 0 0;
}
.toolbar button {
    padding: 6px 10px; background: none; border: 1px solid transparent;
    color: var(--t2); cursor: pointer; border-radius: 6px; font-size: 0.85rem;
    transition: all 0.2s; font-family: 'Inter', sans-serif;
}
.toolbar button:hover { background: var(--bg-c); border-color: var(--border); color: var(--t1); }
.toolbar button[title]::after { content: attr(title); }
.toolbar .sep { width: 1px; background: var(--border); margin: 0 4px; }

.content-editor {
    min-height: 500px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    line-height: 1.7; border-radius: 0 0 var(--r) var(--r); border-top: none;
}

/* FAQ Section */
.faq-section { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
.faq-item { background: var(--bg-c); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 12px; position: relative; }
.faq-item input, .faq-item textarea { margin-bottom: 8px; }
.faq-item textarea { min-height: 60px; }
.faq-remove {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    color: var(--red); border-radius: 50%; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 0.8rem; transition: all 0.2s;
}
.faq-remove:hover { background: rgba(239,68,68,0.2); }
.add-faq-btn {
    padding: 10px 20px; background: none; border: 1px dashed var(--border);
    color: var(--t2); border-radius: var(--r); cursor: pointer; width: 100%;
    font-family: 'Inter', sans-serif; font-size: 0.85rem; transition: all 0.2s;
}
.add-faq-btn:hover { border-color: var(--gold); color: var(--gold); }

/* SEO Panel */
.seo-score-badge {
    width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-family: 'Outfit', sans-serif; font-size: 1.6rem;
    font-weight: 800; margin: 0 auto 16px; border: 3px solid;
}
.seo-score-badge.good { border-color: var(--green); color: var(--green); }
.seo-score-badge.ok { border-color: var(--gold); color: var(--gold); }
.seo-score-badge.bad { border-color: var(--red); color: var(--red); }
.seo-label { text-align: center; font-size: 0.8rem; color: var(--t3); margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

.seo-check { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.seo-check:last-child { border-bottom: none; }
.seo-check .icon { font-size: 0.85rem; margin-top: 2px; flex-shrink: 0; }
.seo-check .icon.pass { color: var(--green); }
.seo-check .icon.fail { color: var(--red); }
.seo-check .icon.warn { color: var(--gold); }
.seo-check .text { font-size: 0.82rem; color: var(--t2); }

/* Preview */
.preview-frame {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--r);
    padding: 40px 24px; max-width: 800px; margin: 0 auto;
}
.preview-frame h1 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 900; margin-bottom: 16px; letter-spacing: -1px; line-height: 1.15; }
.preview-frame .meta { display: flex; gap: 16px; color: var(--t3); font-size: 0.8rem; margin-bottom: 24px; flex-wrap: wrap; }
.preview-frame .meta span { display: flex; align-items: center; gap: 5px; }
.preview-frame .cat-badge { display: inline-block; padding: 4px 12px; background: rgba(245,158,11,0.12); color: var(--gold); border-radius: 99px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
.preview-frame .featured-img { width: 100%; border-radius: var(--r); margin-bottom: 24px; border: 1px solid var(--border); }
.preview-frame .article-body { font-size: 1rem; line-height: 1.85; color: var(--t2); }
.preview-frame .article-body h2 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; color: var(--t1); margin: 36px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.preview-frame .article-body h3 { font-family: 'Outfit', sans-serif; font-size: 1.15rem; color: var(--t1); margin: 24px 0 8px; }
.preview-frame .article-body p { margin-bottom: 16px; }
.preview-frame .article-body strong { color: var(--t1); }
.preview-frame .article-body blockquote { margin: 24px 0; padding: 20px 24px; border-left: 4px solid var(--gold); background: rgba(245,158,11,0.08); border-radius: 0 var(--r) var(--r) 0; font-style: italic; color: var(--t1); }
.preview-frame .article-body blockquote cite { display: block; margin-top: 8px; font-size: 0.82rem; color: var(--t3); font-style: normal; font-weight: 600; }
.preview-frame .article-body ul, .preview-frame .article-body ol { margin: 12px 0 20px 24px; }
.preview-frame .article-body li { margin-bottom: 8px; list-style: disc; }
.preview-frame .article-body ol li { list-style: decimal; }
.preview-frame .article-body img { max-width: 100%; border-radius: var(--r); margin: 20px 0; border: 1px solid var(--border); }
.preview-frame .article-body figure { margin: 24px 0; }
.preview-frame .article-body figcaption { text-align: center; font-size: 0.8rem; color: var(--t3); margin-top: 8px; font-style: italic; }
.preview-frame .article-body a { color: var(--gold); border-bottom: 1px solid rgba(245,158,11,0.3); }
.preview-frame .article-body .did-you-know { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--r); padding: 20px; margin: 24px 0; }
.preview-frame .article-body .did-you-know .dyk-title { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #f87171; margin-bottom: 8px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
.preview-frame .faq-preview details { background: var(--bg-c); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; }
.preview-frame .faq-preview summary { padding: 16px; font-weight: 600; cursor: pointer; color: var(--t1); }
.preview-frame .faq-preview details p { padding: 0 16px 16px; }

/* Generated HTML */
.html-output { position: relative; }
.html-output pre {
    background: var(--bg-c); border: 1px solid var(--border); border-radius: var(--r);
    padding: 20px; overflow-x: auto; font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; line-height: 1.6; color: var(--t2); max-height: 70vh;
    white-space: pre-wrap; word-break: break-all;
}
.action-btns { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.action-btn {
    padding: 10px 24px; border-radius: 99px; font-weight: 700; font-size: 0.85rem;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    border: none; font-family: 'Inter', sans-serif; transition: all 0.2s;
}
.action-btn.primary { background: linear-gradient(135deg, var(--gold), var(--red)); color: #000; }
.action-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(245,158,11,0.3); }
.action-btn.secondary { background: var(--bg-e); border: 1px solid var(--border); color: var(--t1); }
.action-btn.secondary:hover { border-color: var(--gold); }

/* Toast */
.toast {
    position: fixed; bottom: 24px; right: 24px; padding: 12px 24px; background: var(--green);
    color: #000; font-weight: 700; border-radius: 99px; font-size: 0.85rem;
    transform: translateY(100px); opacity: 0; transition: all 0.3s var(--ease); z-index: 999;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* Responsive */
@media (max-width: 900px) {
    .admin-main { grid-template-columns: 1fr; }
    .seo-panel { position: static; max-height: none; border-left: none; border-top: 1px solid var(--border); }
    .form-grid { grid-template-columns: 1fr; }
    .admin-header h1 span.full { display: none; }
}
@media (max-width: 600px) {
    .admin-header { padding: 12px 16px; }
    .editor-panel { padding: 16px; }
    .seo-panel { padding: 16px; }
    .tabs { padding: 0 12px; }
    .tab-btn { padding: 12px 16px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="admin-header">
    <h1><div class="logo-icon">🏏</div> CricketHub <span class="full">Admin — Article Generator</span></h1>
    <span class="badge">ADMIN</span>
</header>

<!-- Tabs -->
<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('write')"><i class="fas fa-pen"></i> Write</button>
    <button class="tab-btn" onclick="switchTab('preview')"><i class="fas fa-eye"></i> Preview</button>
    <button class="tab-btn" onclick="switchTab('html')"><i class="fas fa-code"></i> HTML</button>
</div>

<!-- Main -->
<div class="admin-main">
    <div class="editor-panel">

        <!-- WRITE TAB -->
        <div class="tab-content active" id="tab-write">
            <div class="form-row">
                <label>Title <span class="char-count" id="titleCount">0/60</span></label>
                <input type="text" id="title" placeholder="The Night Virat Kohli Almost Quit Cricket" oninput="onFieldChange()">
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label>Slug</label>
                    <input type="text" id="slug" placeholder="auto-generated-from-title" oninput="onFieldChange()">
                </div>
                <div class="form-row">
                    <label>Category</label>
                    <select id="category" onchange="onFieldChange()">
                        <option value="Untold Stories">Untold Stories</option>
                        <option value="Rise to Fame">Rise to Fame</option>
                        <option value="Behind the Scenes">Behind the Scenes</option>
                        <option value="Legendary Moments">Legendary Moments</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <label>Meta Description <span class="char-count" id="descCount">0/160</span></label>
                <textarea id="metaDesc" rows="2" placeholder="A compelling 150-160 character description for search engines..." oninput="onFieldChange()"></textarea>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label>Focus Keyword</label>
                    <input type="text" id="keyword" placeholder="virat kohli" oninput="onFieldChange()">
                </div>
                <div class="form-row">
                    <label>Tags (comma separated)</label>
                    <input type="text" id="tags" placeholder="virat kohli, cricket, untold story">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label>Featured Image URL</label>
                    <input type="url" id="featuredImage" placeholder="https://..." oninput="onFieldChange()">
                </div>
                <div class="form-row">
                    <label>Or Upload Image</label>
                    <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(this)" style="padding: 8px;">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label>Author</label>
                    <input type="text" id="author" value="CricketHub" oninput="onFieldChange()">
                </div>
                <div class="form-row">
                    <label>Publish Date</label>
                    <input type="date" id="pubDate" oninput="onFieldChange()">
                </div>
            </div>

            <!-- Content Editor -->
            <div class="form-row">
                <label>Content <span class="char-count" id="wordCount">0 words</span></label>
                <div class="toolbar">
                    <button onclick="insertFormat('## ')" title="H2"><i class="fas fa-heading"></i></button>
                    <button onclick="insertFormat('### ')" title="H3"><b style="font-size:0.7rem">H3</b></button>
                    <button onclick="insertWrap('**')" title="Bold"><i class="fas fa-bold"></i></button>
                    <button onclick="insertWrap('*')" title="Italic"><i class="fas fa-italic"></i></button>
                    <div class="sep"></div>
                    <button onclick="insertFormat('> ')" title="Quote"><i class="fas fa-quote-left"></i></button>
                    <button onclick="insertFormat('- ')" title="List"><i class="fas fa-list-ul"></i></button>
                    <button onclick="insertFormat('1. ')" title="Numbered"><i class="fas fa-list-ol"></i></button>
                    <div class="sep"></div>
                    <button onclick="insertLink()" title="Link"><i class="fas fa-link"></i></button>
                    <button onclick="insertImage()" title="Image"><i class="fas fa-image"></i></button>
                    <button onclick="insertDYK()" title="Did You Know"><i class="fas fa-lightbulb"></i></button>
                </div>
                <textarea class="content-editor" id="content" placeholder="Start writing your article here...

## The Beginning of the Story

Write your first paragraph here. Use **bold** for emphasis and *italic* for quotes.

> This is a blockquote from a famous cricketer | Player Name

## The Turning Point

Continue the story...

:::dyk
Virat Kohli scored his first century at age 18.
Another interesting fact here.
:::

## The Legacy

Conclude with impact..." oninput="onFieldChange()"></textarea>
            </div>

            <!-- FAQ Section -->
            <div class="faq-section">
                <label style="font-size: 0.8rem; font-weight: 600; color: var(--t2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: block;">
                    <i class="fas fa-circle-question"></i> FAQ Section (helps SEO!)
                </label>
                <div id="faqList"></div>
                <button class="add-faq-btn" onclick="addFaq()">
                    <i class="fas fa-plus"></i> Add FAQ Item
                </button>
            </div>
        </div>

        <!-- PREVIEW TAB -->
        <div class="tab-content" id="tab-preview">
            <div class="preview-frame" id="previewFrame"></div>
        </div>

        <!-- HTML TAB -->
        <div class="tab-content" id="tab-html">
            <div class="html-output">
                <div class="action-btns">
                    <button class="action-btn primary" onclick="copyHTML()"><i class="fas fa-copy"></i> Copy HTML</button>
                    <button class="action-btn secondary" onclick="downloadZip()"><i class="fas fa-download"></i> Download ZIP</button>
                    <button class="action-btn secondary" onclick="copySitemapEntry()"><i class="fas fa-sitemap"></i> Copy Sitemap Entry</button>
                    <button class="action-btn secondary" onclick="copyArticleJSON()"><i class="fas fa-database"></i> Copy index.js Entry</button>
                </div>
                <pre><code id="htmlCode"></code></pre>
            </div>
        </div>
    </div>

    <!-- SEO Panel -->
    <div class="seo-panel">
        <div class="seo-score-badge bad" id="seoBadge">0</div>
        <div class="seo-label">SEO Score</div>
        <div id="seoChecks"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- State ----
let slugManual = false;

// ---- Init ----
document.getElementById('pubDate').value = new Date().toISOString().split('T')[0];

// ---- Tab Switching ----
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.closest('.tab-btn').classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'preview') renderPreview();
    if (tab === 'html') renderHTML();
}

// ---- Slug Generation ----
document.getElementById('slug').addEventListener('focus', () => { slugManual = true; });
function generateSlug(title) {
    return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').substring(0, 80);
}

// ---- Toolbar Helpers ----
function insertFormat(prefix) {
    const ta = document.getElementById('content');
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const lines = ta.value.substring(start, end).split('\n');
    const formatted = lines.map(l => prefix + l).join('\n');
    ta.setRangeText(formatted, start, end, 'end');
    ta.focus(); onFieldChange();
}
function insertWrap(char) {
    const ta = document.getElementById('content');
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const selected = ta.value.substring(start, end) || 'text';
    ta.setRangeText(char + selected + char, start, end, 'end');
    ta.focus(); onFieldChange();
}
function insertLink() {
    const ta = document.getElementById('content');
    const start = ta.selectionStart;
    const selected = ta.value.substring(start, ta.selectionEnd) || 'link text';
    ta.setRangeText('[' + selected + '](https://)', start, ta.selectionEnd, 'end');
    ta.focus(); onFieldChange();
}
function insertImage() {
    const ta = document.getElementById('content');
    ta.setRangeText('\n![Image description](https://image-url) | Caption text\n', ta.selectionStart, ta.selectionEnd, 'end');
    ta.focus(); onFieldChange();
}
function insertDYK() {
    const ta = document.getElementById('content');
    ta.setRangeText('\n:::dyk\nInteresting cricket fact here.\nAnother fact here.\n:::\n', ta.selectionStart, ta.selectionEnd, 'end');
    ta.focus(); onFieldChange();
}

// ---- Image Upload ----
function handleImageUpload(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('featuredImage').value = e.target.result;
            onFieldChange();
        };
        reader.readAsDataURL(input.files[0]);
    }
}

// ---- FAQ Management ----
let faqCounter = 0;
function addFaq() {
    faqCounter++;
    const div = document.createElement('div');
    div.className = 'faq-item';
    div.id = 'faq-' + faqCounter;
    div.innerHTML = `
        <button class="faq-remove" onclick="this.parentElement.remove(); onFieldChange();"><i class="fas fa-times"></i></button>
        <input type="text" placeholder="Question: e.g., How old was Virat Kohli when he debuted?" oninput="onFieldChange()">
        <textarea rows="2" placeholder="Answer: Virat Kohli made his international debut at the age of 19..." oninput="onFieldChange()"></textarea>
    `;
    document.getElementById('faqList').appendChild(div);
    onFieldChange();
}

function getFaqs() {
    const items = [];
    document.querySelectorAll('.faq-item').forEach(item => {
        const q = item.querySelector('input').value.trim();
        const a = item.querySelector('textarea').value.trim();
        if (q && a) items.push({ q, a });
    });
    return items;
}

// ---- Content Parser (Markdown-like → HTML) ----
function parseContent(raw) {
    if (!raw) return '';
    const lines = raw.split('\n');
    let html = '';
    let inList = false, inOl = false, inDyk = false, dykContent = '';

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // DYK block
        if (line.trim() === ':::dyk') { inDyk = true; dykContent = ''; continue; }
        if (line.trim() === ':::' && inDyk) {
            inDyk = false;
            html += `<div class="did-you-know"><div class="dyk-title"><i class="fas fa-lightbulb"></i> Did You Know?</div>${dykContent}</div>`;
            continue;
        }
        if (inDyk) { dykContent += '<p>' + inlineFormat(line) + '</p>'; continue; }

        // Close lists
        if (inList && !line.startsWith('- ')) { html += '</ul>'; inList = false; }
        if (inOl && !/^\d+\.\s/.test(line)) { html += '</ol>'; inOl = false; }

        // Headings
        if (line.startsWith('### ')) { html += '<h3>' + inlineFormat(line.slice(4)) + '</h3>'; continue; }
        if (line.startsWith('## ')) { html += '<h2 id="' + line.slice(3).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-') + '">' + inlineFormat(line.slice(3)) + '</h2>'; continue; }

        // Blockquote
        if (line.startsWith('> ')) {
            const parts = line.slice(2).split(' | ');
            html += '<blockquote>' + inlineFormat(parts[0]);
            if (parts[1]) html += '<cite>— ' + parts[1].trim() + '</cite>';
            html += '</blockquote>';
            continue;
        }

        // Image with caption
        const imgMatch = line.match(/^!\[(.*?)\]\((.*?)\)(?:\s*\|\s*(.*))?$/);
        if (imgMatch) {
            html += '<figure><img src="' + imgMatch[2] + '" alt="' + imgMatch[1] + '" loading="lazy">';
            if (imgMatch[3]) html += '<figcaption>' + imgMatch[3].trim() + '</figcaption>';
            html += '</figure>';
            continue;
        }

        // Unordered list
        if (line.startsWith('- ')) {
            if (!inList) { html += '<ul>'; inList = true; }
            html += '<li>' + inlineFormat(line.slice(2)) + '</li>';
            continue;
        }

        // Ordered list
        const olMatch = line.match(/^\d+\.\s(.*)$/);
        if (olMatch) {
            if (!inOl) { html += '<ol>'; inOl = true; }
            html += '<li>' + inlineFormat(olMatch[1]) + '</li>';
            continue;
        }

        // Empty line
        if (line.trim() === '') { continue; }

        // Paragraph
        html += '<p>' + inlineFormat(line) + '</p>';
    }

    if (inList) html += '</ul>';
    if (inOl) html += '</ol>';
    return html;
}

function inlineFormat(text) {
    // Links
    text = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>');
    // Bold
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    return text;
}

// ---- Get H2s for TOC ----
function getH2s(content) {
    const matches = [];
    content.split('\n').forEach(line => {
        if (line.startsWith('## ')) {
            const text = line.slice(3).trim();
            const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            matches.push({ text, id });
        }
    });
    return matches;
}

// ---- Field Change Handler ----
function onFieldChange() {
    const title = document.getElementById('title').value;
    const desc = document.getElementById('metaDesc').value;
    const content = document.getElementById('content').value;

    // Auto-slug
    if (!slugManual || !document.getElementById('slug').value) {
        document.getElementById('slug').value = generateSlug(title);
    }

    // Character counts
    const tl = title.length;
    const tc = document.getElementById('titleCount');
    tc.textContent = tl + '/60';
    tc.className = 'char-count ' + (tl >= 50 && tl <= 60 ? 'good' : tl > 60 ? 'bad' : tl > 40 ? 'warn' : '');

    const dl = desc.length;
    const dc = document.getElementById('descCount');
    dc.textContent = dl + '/160';
    dc.className = 'char-count ' + (dl >= 150 && dl <= 160 ? 'good' : dl > 160 ? 'bad' : dl > 130 ? 'warn' : '');

    // Word count
    const words = content.trim().split(/\s+/).filter(w => w && !w.startsWith('#') && !w.startsWith('>') && w !== ':::dyk' && w !== ':::').length;
    const wc = document.getElementById('wordCount');
    wc.textContent = words + ' words';
    wc.className = 'char-count ' + (words >= 1000 ? 'good' : words >= 500 ? 'warn' : 'bad');

    // SEO checks
    updateSEO(title, desc, content, words);
}

// ---- SEO Checker ----
function updateSEO(title, desc, content, words) {
    const keyword = document.getElementById('keyword').value.toLowerCase();
    const image = document.getElementById('featuredImage').value;
    const faqs = getFaqs();
    const h2Count = (content.match(/^## /gm) || []).length;
    const hasInternalLink = /\]\(\/(.*?)\)/.test(content);
    const hasContentImage = /!\[.*?\]\(.*?\)/.test(content);
    const firstPara = content.split('\n').find(l => l.trim() && !l.startsWith('#') && !l.startsWith('>') && !l.startsWith('-') && !l.startsWith(':::')) || '';

    const checks = [
        { pass: title.length >= 50 && title.length <= 60, warn: title.length > 40, text: `Title length: ${title.length}/60 chars ${title.length >= 50 && title.length <= 60 ? '(perfect)' : title.length > 60 ? '(too long)' : '(aim for 50-60)'}` },
        { pass: desc.length >= 150 && desc.length <= 160, warn: desc.length > 130, text: `Meta description: ${desc.length}/160 chars` },
        { pass: words >= 1000, warn: words >= 500, text: `Word count: ${words} ${words >= 1500 ? '(excellent!)' : words >= 1000 ? '(good)' : words >= 500 ? '(aim for 1000+)' : '(too short!)'}` },
        { pass: h2Count >= 3, warn: h2Count >= 2, text: `H2 headings: ${h2Count} ${h2Count >= 3 ? '(good)' : '(need at least 3)'}` },
        { pass: !!image, text: `Featured image: ${image ? 'set' : 'missing'}` },
        { pass: keyword && title.toLowerCase().includes(keyword), text: `Keyword in title: ${keyword ? (title.toLowerCase().includes(keyword) ? 'yes' : 'no') : 'set keyword first'}` },
        { pass: keyword && desc.toLowerCase().includes(keyword), text: `Keyword in description: ${keyword ? (desc.toLowerCase().includes(keyword) ? 'yes' : 'no') : 'set keyword first'}` },
        { pass: keyword && firstPara.toLowerCase().includes(keyword), text: `Keyword in first paragraph: ${keyword ? (firstPara.toLowerCase().includes(keyword) ? 'yes' : 'no') : 'set keyword first'}` },
        { pass: hasInternalLink, text: `Internal links: ${hasInternalLink ? 'found' : 'add links to other articles'}` },
        { pass: hasContentImage, text: `Content images: ${hasContentImage ? 'found' : 'add images in article'}` },
        { pass: faqs.length > 0, text: `FAQ section: ${faqs.length > 0 ? faqs.length + ' items' : 'none (add FAQs!)'}` },
    ];

    const passCount = checks.filter(c => c.pass).length;
    const score = Math.round((passCount / checks.length) * 100);

    const badge = document.getElementById('seoBadge');
    badge.textContent = score;
    badge.className = 'seo-score-badge ' + (score >= 80 ? 'good' : score >= 50 ? 'ok' : 'bad');

    document.getElementById('seoChecks').innerHTML = checks.map(c =>
        `<div class="seo-check">
            <span class="icon ${c.pass ? 'pass' : c.warn ? 'warn' : 'fail'}">
                <i class="fas ${c.pass ? 'fa-circle-check' : c.warn ? 'fa-triangle-exclamation' : 'fa-circle-xmark'}"></i>
            </span>
            <span class="text">${c.text}</span>
        </div>`
    ).join('');
}

function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function copyHTML() {
    navigator.clipboard.writeText(getGeneratedHTML()).then(() => showToast('✅ HTML copied to clipboard!'));
}

async function downloadZip() {
    const zip = new JSZip();
    const slug = document.getElementById('slug').value || 'article';
    const folder = zip.folder(slug);
    folder.file('index.html', getGeneratedHTML());
    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = slug + '.zip'; a.click();
    URL.revokeObjectURL(url);
    showToast('📦 ZIP downloaded!');
}

function copySitemapEntry() {
    const slug = document.getElementById('slug').value || 'article';
    const date = document.getElementById('pubDate').value || new Date().toISOString().split('T')[0];
    const entry = `  <url>\n    <loc>https://crickethub.co.in/articles/${slug}/</loc>\n    <lastmod>${date}</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.7</priority>\n  </url>`;
    navigator.clipboard.writeText(entry).then(() => showToast('🗺️ Sitemap entry copied!'));
}

function copyArticleJSON() {
    const title = document.getElementById('title').value;
    const slug = document.getElementById('slug').value;
    const category = document.getElementById('category').value;
    const catSlug = category.toLowerCase().replace(/\s+/g, '-');
    const desc = document.getElementById('metaDesc').value;
    const image = document.getElementById('featuredImage').value;
    const date = document.getElementById('pubDate').value;
    const content = document.getElementById('content').value;
    const words = content.trim().split(/\s+/).length;
    const readTime = Math.ceil(words / 200) + ' min read';

    const json = `    {
        title: "${title.replace(/"/g, '\\"')}",
        slug: "${slug}",
        category: "${category}",
        categorySlug: "${catSlug}",
        description: "${desc.replace(/"/g, '\\"')}",
        image: "/articles/${slug}/featured.jpg",
        date: "${date}",
        readTime: "${readTime}",
        featured: false
    }`;
    navigator.clipboard.writeText(json).then(() => showToast('📋 Article entry copied! Add to ARTICLES array in index.js'));
}

// Init SEO
onFieldChange();
